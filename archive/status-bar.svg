<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="100%" height="100%">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bar-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111922"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <rect width="800" height="50" fill="url(#bar-bg)" rx="3"/>
  <rect width="800" height="50" fill="none" stroke="#00ff88" stroke-width="0.5" rx="3" opacity="0.3"/>

  <!-- Blinking status dot -->
  <circle cx="25" cy="25" r="6" fill="#00ff88" filter="url(#glow-green)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <text x="42" y="30" font-family="'Courier New', monospace" font-size="13" fill="#00ff88" font-weight="bold" filter="url(#glow-green)">
    SYSTEM ONLINE
  </text>

  <!-- Separator -->
  <text x="200" y="30" font-family="'Courier New', monospace" font-size="13" fill="#333333">│</text>

  <text x="215" y="30" font-family="'Courier New', monospace" font-size="11" fill="#00ccff">
    NODE: spinner-bot@HHU-DIG-Lab
  </text>

  <text x="460" y="30" font-family="'Courier New', monospace" font-size="13" fill="#333333">│</text>

  <text x="475" y="30" font-family="'Courier New', monospace" font-size="11" fill="#ff00ff" filter="url(#glow-magenta)">
    MODE: RESEARCH_&amp;_BUILD
  </text>

  <text x="675" y="30" font-family="'Courier New', monospace" font-size="13" fill="#333333">│</text>

  <text x="690" y="30" font-family="'Courier New', monospace" font-size="11" fill="#ff6600">
    UPTIME: ∞
  </text>
</svg>
