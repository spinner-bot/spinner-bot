<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="80" fill="#0D1117"/>
  <rect x="0" y="0" width="4" height="80" fill="#00ccff" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00ccff" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="79" x2="1200" y2="79" stroke="#00ccff" stroke-width="0.5" opacity="0.15"/>
  <text x="24" y="32" font-family="'Courier New', monospace" font-size="13" fill="#00ff88" opacity="0.7" filter="url(#glow-green)">> system.stats --render --live</text>
  <text x="24" y="62" font-family="'Segoe UI','Arial Black',sans-serif" font-size="28" font-weight="900" fill="#00ccff" filter="url(#glow-cyan)">📊 STATS CONSOLE</text>
  <text x="430" y="62" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#888888">/ 统计面板</text>
  <circle cx="1180" cy="40" r="3" fill="#00ccff" opacity="0.6" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
