<rect class="panel" x="112" y="133" width="976" height="348" rx="16"/>
<rect x="139" y="157" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="153" y="176" >AUTUMN 2025</text>
<path class="hairline" d="M139 188H1061"/>
<text class="title-en" x="139" y="218" >Programming Foundations &amp; First Builds</text>
<text class="title-zh" x="139" y="249" >编程基础与工程起步</text>
<text class="body-en" x="139" y="303" >Began undergraduate study at Hohai University, establishing a foundation in computing and intelligent technologies.</text>
<text class="body-en" x="139" y="330" >C/C++ programming and team software projects developed my ability to translate problems into working</text>
<text class="body-en" x="139" y="357" >implementations.</text>
<path class="hairline" d="M139 384H1061"/>
<text class="body-zh" x="139" y="416" >进入河海大学，开启计算机与智能技术领域的系统学习。通过 C/C++ 编程和团队软件项目建立实现基础，逐步形成从问</text>
<text class="body-zh" x="139" y="445" >题分析到代码落地的工程思维。</text>
<path d="M139 469H181" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="112" y="633" width="976" height="348" rx="16"/>
<rect x="139" y="657" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="153" y="676" >SPRING 2026</text>
<path class="hairline" d="M139 688H1061"/>
<text class="title-en" x="139" y="718" >Machine Learning &amp; Research Practice</text>
<text class="title-zh" x="139" y="749" >机器学习与研究实践</text>
<text class="body-en" x="139" y="803" >Developed a broad foundation in machine learning and deep learning through model implementation and</text>
<text class="body-en" x="139" y="830" >experimentation. Joined a research team to investigate specific machine learning algorithm optimization problems,</text>
<text class="body-en" x="139" y="857" >extending my focus from learning algorithms to research questions, methodological design, and empirical analysis.</text>
<path class="hairline" d="M139 884H1061"/>
<text class="body-zh" x="139" y="916" >系统拓展机器学习与深度学习知识，通过模型实现和实验建立对核心方法的理解。进入研究团队，开始探索具体的机器学</text>
<text class="body-zh" x="139" y="945" >习算法优化问题，将关注点从算法学习推进到研究问题、方法设计与实证分析。</text>
<path d="M139 969H181" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="112" y="1011" width="976" height="404" rx="16"/>
<rect x="139" y="1035" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="153" y="1054" >SUMMER 2026</text>
<path class="hairline" d="M139 1066H1061"/>
<text class="title-en" x="139" y="1096" >Multimodal Intelligence &amp; Policy Distillation</text>
<text class="title-zh" x="139" y="1127" >多模态智能与策略蒸馏</text>
<text class="body-en" x="139" y="1181" >Extended my research focus to multimodal large language models and Online Policy Distillation (OPD). With access to</text>
<text class="body-en" x="139" y="1208" >advanced computing resources, I independently pursued Vision-OPD reproduction and follow-up experiments,</text>
<text class="body-en" x="139" y="1235" >testing methodological hypotheses, analyzing performance gaps, and investigating the possibilities and limitations of</text>
<text class="body-en" x="139" y="1262" >model capability transfer.</text>
<path class="hairline" d="M139 1289H1061"/>
<text class="body-zh" x="139" y="1321" >将研究重心拓展至多模态大语言模型与在线策略蒸馏（Online Policy Distillation, OPD）。借助高水平计算资源，独立开</text>
<text class="body-zh" x="139" y="1350" >展 Vision-OPD 复现与后续方案探索，通过实验检验方法假设、分析性能差距，并进一步理解模型能力迁移的技术路径与</text>
<text class="body-zh" x="139" y="1379" >局限。</text>
<path d="M139 1403H181" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="112" y="1445" width="976" height="348" rx="16"/>
<rect x="139" y="1469" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="153" y="1488" >AUTUMN 2026</text>
<path class="hairline" d="M139 1500H1061"/>
<text class="title-en" x="139" y="1530" >Model Architectures &amp; Emerging Directions</text>
<text class="title-zh" x="139" y="1561" >模型架构与前沿探索</text>
<text class="body-en" x="139" y="1615" >Expanded into tabular learning and alternative model architectures, exploring TabPFN, gradient-boosted trees, and</text>
<text class="body-en" x="139" y="1642" >FT-Transformer, while investigating the mechanisms and potential applications of emerging approaches such as JEV.</text>
<text class="body-en" x="139" y="1669" >Continuing to identify promising research questions and technical opportunities.</text>
<path class="hairline" d="M139 1696H1061"/>
<text class="body-zh" x="139" y="1728" >将探索范围延伸至表格学习与新型模型架构，研究 TabPFN、梯度提升树和 FT-Transformer 等方法，并关注 JEV 等新</text>
<text class="body-zh" x="139" y="1757" >兴方向的机制与应用潜力。持续拓展技术视野，寻找具有研究价值的问题与切入点。</text>
<path d="M139 1781H181" stroke="url(#accent)" stroke-width="2"/>
