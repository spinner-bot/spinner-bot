<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1909" width="1200" height="1909" role="img" aria-labelledby="timeline-desc">
  <title id="timeline-desc">Bilingual research timeline, 2025 to 2026 / 2025 至 2026 年研究时间线</title>
  <style>
      text { font-family: Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .panel { fill: #0a1b23; stroke: #2a4850; stroke-width: 1; }
      .hairline { fill: none; stroke: #29454d; stroke-width: 1; }
      .track { fill: none; stroke: #28636d; stroke-width: 26px; stroke-linecap: round; stroke-linejoin: round; }
      .track-core { fill: none; stroke: #76e9d3; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
      .node-halo { fill: #72ead2; opacity: .17; }
      .node-ring { fill: #0a2630; stroke: #a5ffec; stroke-width: 3; }
      .node-core { fill: #8ff8e1; }
      .date { fill: #76efd8; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
      .date-zh { fill: #9ad9dd; font-size: 14px; font-weight: 650; }
      .title-en { fill: #f0fcfb; font-size: 19px; font-weight: 700; }
      .title-zh { fill: #c9e6e5; font-size: 19px; font-weight: 650; }
      .body-en { fill: #b7cacc; font-size: 17px; }
      .body-zh { fill: #b7cacc; font-size: 17px; }
      .year { fill: #e8fffa; font-size: 17px; font-weight: 760; letter-spacing: .09em; }
    </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#061117"/><stop offset=".62" stop-color="#081b23"/><stop offset="1" stop-color="#0b222d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#70efd5"/><stop offset="1" stop-color="#72c9ff"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#163039" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1200" height="1909" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="1909" fill="url(#background)"/>
    <rect width="1200" height="1909" fill="url(#grid)" opacity=".25"/>
    <path class="track" d="M50 28V458 Q50 492 84 492 H1116 Q1150 492 1150 526 V1880"/>
<path class="track-core" d="M50 28V458 Q50 492 84 492 H1116 Q1150 492 1150 526 V1880"/>
<path class="hairline" d="M50 106H86"/>
<circle class="node-halo" cx="50" cy="106" r="26"/>
<circle class="node-ring" cx="50" cy="106" r="19"/>
<circle class="node-core" cx="50" cy="106" r="6"/>
<path class="hairline" d="M1114 606H1150"/>
<circle class="node-halo" cx="1150" cy="606" r="26"/>
<circle class="node-ring" cx="1150" cy="606" r="19"/>
<circle class="node-core" cx="1150" cy="606" r="6"/>
<path class="hairline" d="M1114 1040H1150"/>
<circle class="node-halo" cx="1150" cy="1040" r="26"/>
<circle class="node-ring" cx="1150" cy="1040" r="19"/>
<circle class="node-core" cx="1150" cy="1040" r="6"/>
<path class="hairline" d="M1114 1501H1150"/>
<circle class="node-halo" cx="1150" cy="1501" r="26"/>
<circle class="node-ring" cx="1150" cy="1501" r="19"/>
<circle class="node-core" cx="1150" cy="1501" r="6"/>
<rect class="panel" x="86" y="68" width="800" height="348" rx="16"/>
<rect x="113" y="92" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="127" y="111" >AUTUMN 2025</text>
<text class="date-zh" x="859" y="111" text-anchor="end">秋</text>
<path class="hairline" d="M113 123H859"/>
<text class="title-en" x="113" y="153" >Programming Foundations &amp; First Builds</text>
<text class="title-zh" x="113" y="184" >编程基础与工程起步</text>
<text class="body-en" x="113" y="238" >Began undergraduate study at Hohai University, establishing a foundation in computing and</text>
<text class="body-en" x="113" y="265" >intelligent technologies. C/C++ programming and team software projects developed my ability</text>
<text class="body-en" x="113" y="292" >to translate problems into working implementations.</text>
<path class="hairline" d="M113 319H859"/>
<text class="body-zh" x="113" y="351" >进入河海大学，开启计算机与智能技术领域的系统学习。通过 C/C++ 编程和团队软件项目建立实</text>
<text class="body-zh" x="113" y="380" >现基础，逐步形成从问题分析到代码落地的工程思维。</text>
<path d="M113 404H155" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="314" y="568" width="800" height="404" rx="16"/>
<rect x="341" y="592" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="355" y="611" >SPRING 2026</text>
<text class="date-zh" x="1087" y="611" text-anchor="end">春</text>
<path class="hairline" d="M341 623H1087"/>
<text class="title-en" x="341" y="653" >Machine Learning &amp; Research Practice</text>
<text class="title-zh" x="341" y="684" >机器学习与研究实践</text>
<text class="body-en" x="341" y="738" >Developed a broad foundation in machine learning and deep learning through model</text>
<text class="body-en" x="341" y="765" >implementation and experimentation. Joined a research team to investigate specific machine</text>
<text class="body-en" x="341" y="792" >learning algorithm optimization problems, extending my focus from learning algorithms to</text>
<text class="body-en" x="341" y="819" >research questions, methodological design, and empirical analysis.</text>
<path class="hairline" d="M341 846H1087"/>
<text class="body-zh" x="341" y="878" >系统拓展机器学习与深度学习知识，通过模型实现和实验建立对核心方法的理解。进入研究团队，</text>
<text class="body-zh" x="341" y="907" >开始探索具体的机器学习算法优化问题，将关注点从算法学习推进到研究问题、方法设计与实证分</text>
<text class="body-zh" x="341" y="936" >析。</text>
<path d="M341 960H383" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="314" y="1002" width="800" height="431" rx="16"/>
<rect x="341" y="1026" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="355" y="1045" >SUMMER 2026</text>
<text class="date-zh" x="1087" y="1045" text-anchor="end">夏</text>
<path class="hairline" d="M341 1057H1087"/>
<text class="title-en" x="341" y="1087" >Multimodal Intelligence &amp; Policy Distillation</text>
<text class="title-zh" x="341" y="1118" >多模态智能与策略蒸馏</text>
<text class="body-en" x="341" y="1172" >Extended my research focus to multimodal large language models and Online Policy Distillation</text>
<text class="body-en" x="341" y="1199" >(OPD). With access to advanced computing resources, I independently pursued Vision-OPD</text>
<text class="body-en" x="341" y="1226" >reproduction and follow-up experiments, testing methodological hypotheses, analyzing</text>
<text class="body-en" x="341" y="1253" >performance gaps, and investigating the possibilities and limitations of model capability</text>
<text class="body-en" x="341" y="1280" >transfer.</text>
<path class="hairline" d="M341 1307H1087"/>
<text class="body-zh" x="341" y="1339" >将研究重心拓展至多模态大语言模型与在线策略蒸馏（Online Policy Distillation, OPD）。借助</text>
<text class="body-zh" x="341" y="1368" >高水平计算资源，独立开展 Vision-OPD 复现与后续方案探索，通过实验检验方法假设、分析性能</text>
<text class="body-zh" x="341" y="1397" >差距，并进一步理解模型能力迁移的技术路径与局限。</text>
<path d="M341 1421H383" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="314" y="1463" width="800" height="404" rx="16"/>
<rect x="341" y="1487" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="355" y="1506" >AUTUMN 2026</text>
<text class="date-zh" x="1087" y="1506" text-anchor="end">秋</text>
<path class="hairline" d="M341 1518H1087"/>
<text class="title-en" x="341" y="1548" >Model Architectures &amp; Emerging Directions</text>
<text class="title-zh" x="341" y="1579" >模型架构与前沿探索</text>
<text class="body-en" x="341" y="1633" >Expanded into tabular learning and alternative model architectures, exploring TabPFN,</text>
<text class="body-en" x="341" y="1660" >gradient-boosted trees, and FT-Transformer, while investigating the mechanisms and</text>
<text class="body-en" x="341" y="1687" >potential applications of emerging approaches such as JEV. Continuing to identify promising</text>
<text class="body-en" x="341" y="1714" >research questions and technical opportunities.</text>
<path class="hairline" d="M341 1741H1087"/>
<text class="body-zh" x="341" y="1773" >将探索范围延伸至表格学习与新型模型架构，研究 TabPFN、梯度提升树和 FT-Transformer 等</text>
<text class="body-zh" x="341" y="1802" >方法，并关注 JEV 等新兴方向的机制与应用潜力。持续拓展技术视野，寻找具有研究价值的问题</text>
<text class="body-zh" x="341" y="1831" >与切入点。</text>
<path d="M341 1855H383" stroke="url(#accent)" stroke-width="2"/>
<rect x="552" y="464" width="96" height="56" rx="28" fill="#10313a" stroke="#9af5df" stroke-width="2"/>
<text class="year" x="600" y="498" text-anchor="middle">2026</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="1908" rx="19.5" fill="none" stroke="#29434c"/>
</svg>
