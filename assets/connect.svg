<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="connect-title connect-desc">
  <title id="connect-title">Let's connect！</title>
  <desc id="connect-desc">A bilingual invitation to exchange ideas and build what comes next. Animated signals travel along an upward path.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { fill: #effffc; font-size: 52px; font-weight: 760; letter-spacing: -.025em; }
    .body-en { fill: #d6eeec; font-size: 23px; font-weight: 510; }
    .body-zh { fill: #abc9ca; font-size: 21px; }
    .copy-rule { fill: none; stroke: #29454d; stroke-width: 1; }
    .route-ghost { fill: none; stroke: #234b55; stroke-width: 3; stroke-linecap: round; }
    .route { fill: none; stroke: #3a8387; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .route-core { fill: none; stroke: #8debd9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #a1f8e6; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .waypoint { fill: #abfceb; stroke: #0a2831; stroke-width: 2; }
    .arrival { fill: #0a2831; stroke: #a1f8e6; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: arrival 3.2s ease-in-out infinite; }
    .traveler { fill: #d3fff4; stroke: #83efdf; stroke-width: 2; }
    .spark { fill: none; stroke: #7ce7d4; stroke-width: 2; stroke-linecap: round; }
    .spark-b { fill: #7ce7d4; stroke: none; }
    .spark-a { animation: twinkle 2.7s ease-in-out infinite; }
    .spark-b { animation: twinkle 2.7s ease-in-out 1.1s infinite; }
    @keyframes arrival { 50% { opacity: .5; transform: scale(1.35); } }
    @keyframes twinkle { 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) {
      .arrival, .spark { animation: none; }
      .traveler { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061117"/><stop offset=".20" stop-color="#061117"/><stop offset=".48" stop-color="#07191d"/><stop offset=".70" stop-color="#0b2829"/><stop offset=".85" stop-color="#143b35"/><stop offset=".94" stop-color="#205445"/><stop offset="1" stop-color="#2b6b52"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#70efd5"/><stop offset="1" stop-color="#72c9ff"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#163039" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity=".25"/>
    <path d="M76 126H684" stroke="#29454d" stroke-width="1"/>
    <path d="M76 126h92" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text class="heading" x="76" y="101">Let's connect！</text>
    <text class="body-en" x="76" y="183">Have an idea, a question, or a project in mind?</text>
    <text class="body-en" x="76" y="218">Let's exchange perspectives and build what's next.</text>
    <path class="copy-rule" d="M76 240H665"/>
    <text class="body-zh" x="76" y="275">有想法、问题，或正在酝酿的项目吗？</text>
    <text class="body-zh" x="76" y="311">欢迎交流观点，一起构建下一步的可能。</text>
    <path class="route-ghost" d="M788 316 C870 312 903 297 959 264 S1060 208 1140 187"/>
    <path class="route" d="M784 291 C846 291 849 248 905 232 S978 188 1018 166 S1080 113 1117 76"/>
    <path class="route-core" d="M784 291 C846 291 849 248 905 232 S978 188 1018 166 S1080 113 1117 76"/>
    <circle class="waypoint" cx="784" cy="291" r="5"/>
<circle class="waypoint" cx="905" cy="232" r="5"/>
<circle class="waypoint" cx="1018" cy="166" r="5"/>
    <circle class="arrival" cx="1117" cy="76" r="14"/>
    <path class="arrow" d="M1093 80L1117 76L1111 101"/>
<circle class="traveler" r="6">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M784 291 C846 291 849 248 905 232 S978 188 1018 166 S1080 113 1117 76"/>
    </circle>
    <circle class="traveler" r="4" opacity=".65">
      <animateMotion dur="4.8s" begin="2.4s" repeatCount="indefinite" path="M784 291 C846 291 849 248 905 232 S978 188 1018 166 S1080 113 1117 76"/>
    </circle>
    <path class="spark spark-a" d="M1038 106l6 -14M1062 129l12 -7M1126 120l5 -11"/>
    <circle class="spark spark-b" cx="1084" cy="71" r="3"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#29434c"/>
</svg>
