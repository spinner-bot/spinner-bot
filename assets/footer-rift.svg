<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="80" fill="#0D1117"/>

  <!-- Rift line -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#00ff88" stroke-width="0.5" opacity="0.4" filter="url(#glow-green)"/>

  <!-- Center diamond -->
  <polygon points="600,30 610,40 600,50 590,40" fill="#ff00ff" filter="url(#glow-magenta)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Decorative dots on line -->
  <circle cx="200" cy="40" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="350" cy="40" r="1.5" fill="#00ccff" opacity="0.4"/>
  <circle cx="850" cy="40" r="1.5" fill="#00ccff" opacity="0.4"/>
  <circle cx="1000" cy="40" r="2" fill="#00ff88" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="600" y="68" font-family="'Courier New', monospace" font-size="11" fill="#666666" text-anchor="middle">
    ⚡ POWERED BY CAFFEINE &amp; CURIOSITY ⚡
  </text>
</svg>
