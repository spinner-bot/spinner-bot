<text class="date" x="89" y="1383" >SUMMER 2026</text>
<path class="hairline" d="M75 1395H315"/>
<text class="title-en" x="75" y="1422" >Multimodal Intelligence &amp; Policy</text>
<text class="title-en" x="75" y="1444" >Distillation</text>
<text class="title-zh" x="75" y="1470" >多模态智能与策略蒸馏</text>
<text class="body-en" x="75" y="1515" >Extended my research focus to</text>
<text class="body-en" x="75" y="1538" >multimodal large language models and</text>
<text class="body-en" x="75" y="1561" >Online Policy Distillation (OPD).</text>
<text class="body-en" x="75" y="1584" >With access to advanced computing</text>
<text class="body-en" x="75" y="1607" >resources, I independently pursued</text>
<text class="body-en" x="75" y="1630" >Vision-OPD reproduction and</text>
<text class="body-en" x="75" y="1653" >follow-up experiments, testing</text>
<text class="body-en" x="75" y="1676" >methodological hypotheses, analyzing</text>
<text class="body-en" x="75" y="1699" >performance gaps, and investigating</text>
<text class="body-en" x="75" y="1722" >the possibilities and limitations of</text>
<text class="body-en" x="75" y="1745" >model capability transfer.</text>
<path class="hairline" d="M75 1768H315"/>
<text class="body-zh" x="75" y="1795" >将研究重心拓展至多模态大语言模型</text>
<text class="body-zh" x="75" y="1820" >与在线策略蒸馏（Online Policy</text>
<text class="body-zh" x="75" y="1845" >Distillation, OPD）。借助高水平计</text>
<text class="body-zh" x="75" y="1870" >算资源，独立开展 Vision-OPD 复现</text>
<text class="body-zh" x="75" y="1895" >与后续方案探索，通过实验检验方法</text>
<text class="body-zh" x="75" y="1920" >假设、分析性能差距，并进一步理解</text>
<text class="body-zh" x="75" y="1945" >模型能力迁移的技术路径与局限。</text>
