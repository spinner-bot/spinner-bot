<text class="title-en" x="75" y="181" >Programming Foundations &amp; First</text>
<text class="title-en" x="75" y="203" >Builds</text>
<text class="title-zh" x="75" y="229" >编程基础与工程起步</text>
<text class="body-en" x="75" y="274" >Began undergraduate study at Hohai</text>
<text class="body-en" x="75" y="297" >University, establishing a</text>
<text class="body-en" x="75" y="320" >foundation in computing and</text>
<text class="body-en" x="75" y="343" >intelligent technologies. C/C++</text>
<text class="body-en" x="75" y="366" >programming and team software</text>
<text class="body-en" x="75" y="389" >projects developed my ability to</text>
<text class="body-en" x="75" y="412" >translate problems into working</text>
<text class="body-en" x="75" y="435" >implementations.</text>
<path class="hairline" d="M75 458H315"/>
<text class="body-zh" x="75" y="485" >进入河海大学，开启计算机与智能技</text>
<text class="body-zh" x="75" y="510" >术领域的系统学习。通过 C/C++ 编</text>
<text class="body-zh" x="75" y="535" >程和团队软件项目建立实现基础，逐</text>
<text class="body-zh" x="75" y="560" >步形成从问题分析到代码落地的工程</text>
<text class="body-zh" x="75" y="585" >思维。</text>
