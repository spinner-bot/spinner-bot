<rect class="panel" x="44" y="44" width="323" height="418" rx="16"/>
<rect x="65" y="68" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="79" y="81" >AUTUMN 2025</text>
<text class="date-zh" x="346" y="81" text-anchor="end">秋</text>
<path class="hairline" d="M65 93H346"/>
<text class="title-en" x="65" y="120" >Programming Foundations &amp; First Builds</text>
<text class="title-zh" x="65" y="146" >编程基础与工程起步</text>
<text class="body-en" x="65" y="191" >Began undergraduate study at Hohai</text>
<text class="body-en" x="65" y="214" >University, establishing a foundation in</text>
<text class="body-en" x="65" y="237" >computing and intelligent technologies.</text>
<text class="body-en" x="65" y="260" >C/C++ programming and team software</text>
<text class="body-en" x="65" y="283" >projects developed my ability to translate</text>
<text class="body-en" x="65" y="306" >problems into working implementations.</text>
<path class="hairline" d="M65 329H346"/>
<text class="body-zh" x="65" y="356" >进入河海大学，开启计算机与智能技术领域</text>
<text class="body-zh" x="65" y="381" >的系统学习。通过 C/C++ 编程和团队软件</text>
<text class="body-zh" x="65" y="406" >项目建立实现基础，逐步形成从问题分析到</text>
<text class="body-zh" x="65" y="431" >代码落地的工程思维。</text>
<path d="M65 450H107" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="23" y="584" width="323" height="512" rx="16"/>
<rect x="44" y="608" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="58" y="621" >SPRING 2026</text>
<text class="date-zh" x="325" y="621" text-anchor="end">春</text>
<path class="hairline" d="M44 633H325"/>
<text class="title-en" x="44" y="660" >Machine Learning &amp; Research Practice</text>
<text class="title-zh" x="44" y="686" >机器学习与研究实践</text>
<text class="body-en" x="44" y="731" >Developed a broad foundation in machine</text>
<text class="body-en" x="44" y="754" >learning and deep learning through model</text>
<text class="body-en" x="44" y="777" >implementation and experimentation. Joined</text>
<text class="body-en" x="44" y="800" >a research team to investigate specific</text>
<text class="body-en" x="44" y="823" >machine learning algorithm optimization</text>
<text class="body-en" x="44" y="846" >problems, extending my focus from learning</text>
<text class="body-en" x="44" y="869" >algorithms to research questions,</text>
<text class="body-en" x="44" y="892" >methodological design, and empirical</text>
<text class="body-en" x="44" y="915" >analysis.</text>
<path class="hairline" d="M44 938H325"/>
<text class="body-zh" x="44" y="965" >系统拓展机器学习与深度学习知识，通过模</text>
<text class="body-zh" x="44" y="990" >型实现和实验建立对核心方法的理解。进入</text>
<text class="body-zh" x="44" y="1015" >研究团队，开始探索具体的机器学习算法优</text>
<text class="body-zh" x="44" y="1040" >化问题，将关注点从算法学习推进到研究问</text>
<text class="body-zh" x="44" y="1065" >题、方法设计与实证分析。</text>
<path d="M44 1084H86" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="23" y="1122" width="323" height="582" rx="16"/>
<rect x="44" y="1146" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="58" y="1159" >SUMMER 2026</text>
<text class="date-zh" x="325" y="1159" text-anchor="end">夏</text>
<path class="hairline" d="M44 1171H325"/>
<text class="title-en" x="44" y="1198" >Multimodal Intelligence &amp; Policy</text>
<text class="title-en" x="44" y="1220" >Distillation</text>
<text class="title-zh" x="44" y="1246" >多模态智能与策略蒸馏</text>
<text class="body-en" x="44" y="1291" >Extended my research focus to multimodal</text>
<text class="body-en" x="44" y="1314" >large language models and Online Policy</text>
<text class="body-en" x="44" y="1337" >Distillation (OPD). With access to</text>
<text class="body-en" x="44" y="1360" >advanced computing resources, I</text>
<text class="body-en" x="44" y="1383" >independently pursued Vision-OPD</text>
<text class="body-en" x="44" y="1406" >reproduction and follow-up experiments,</text>
<text class="body-en" x="44" y="1429" >testing methodological hypotheses,</text>
<text class="body-en" x="44" y="1452" >analyzing performance gaps, and</text>
<text class="body-en" x="44" y="1475" >investigating the possibilities and</text>
<text class="body-en" x="44" y="1498" >limitations of model capability transfer.</text>
<path class="hairline" d="M44 1521H325"/>
<text class="body-zh" x="44" y="1548" >将研究重心拓展至多模态大语言模型与在线</text>
<text class="body-zh" x="44" y="1573" >策略蒸馏（Online Policy Distillation, OPD）。</text>
<text class="body-zh" x="44" y="1598" >借助高水平计算资源，独立开展</text>
<text class="body-zh" x="44" y="1623" >Vision-OPD 复现与后续方案探索，通过实</text>
<text class="body-zh" x="44" y="1648" >验检验方法假设、分析性能差距，并进一步</text>
<text class="body-zh" x="44" y="1673" >理解模型能力迁移的技术路径与局限。</text>
<path d="M44 1692H86" stroke="url(#accent)" stroke-width="2"/>
<rect class="panel" x="23" y="1730" width="323" height="511" rx="16"/>
<rect x="44" y="1754" width="3" height="20" rx="1.5" fill="url(#accent)"/>
<text class="date" x="58" y="1767" >AUTUMN 2026</text>
<text class="date-zh" x="325" y="1767" text-anchor="end">秋</text>
<path class="hairline" d="M44 1779H325"/>
<text class="title-en" x="44" y="1806" >Model Architectures &amp; Emerging</text>
<text class="title-en" x="44" y="1828" >Directions</text>
<text class="title-zh" x="44" y="1854" >模型架构与前沿探索</text>
<text class="body-en" x="44" y="1899" >Expanded into tabular learning and</text>
<text class="body-en" x="44" y="1922" >alternative model architectures, exploring</text>
<text class="body-en" x="44" y="1945" >TabPFN, gradient-boosted trees, and</text>
<text class="body-en" x="44" y="1968" >FT-Transformer, while investigating the</text>
<text class="body-en" x="44" y="1991" >mechanisms and potential applications of</text>
<text class="body-en" x="44" y="2014" >emerging approaches such as JEV.</text>
<text class="body-en" x="44" y="2037" >Continuing to identify promising research</text>
<text class="body-en" x="44" y="2060" >questions and technical opportunities.</text>
<path class="hairline" d="M44 2083H325"/>
<text class="body-zh" x="44" y="2110" >将探索范围延伸至表格学习与新型模型架构，</text>
<text class="body-zh" x="44" y="2135" >研究 TabPFN、梯度提升树和</text>
<text class="body-zh" x="44" y="2160" >FT-Transformer 等方法，并关注 JEV 等</text>
<text class="body-zh" x="44" y="2185" >新兴方向的机制与应用潜力。持续拓展技术</text>
<text class="body-zh" x="44" y="2210" >视野，寻找具有研究价值的问题与切入点。</text>
<path d="M44 2229H86" stroke="url(#accent)" stroke-width="2"/>
<rect x="151" y="499" width="88" height="50" rx="25" fill="#10313a" stroke="#9af5df" stroke-width="2"/>
<text class="year" x="195" y="530" text-anchor="middle">2026</text>
