<text class="title-en" x="75" y="2100" >Directions</text>
<text class="title-zh" x="75" y="2126" >模型架构与前沿探索</text>
<text class="body-en" x="75" y="2171" >Expanded into tabular learning and</text>
<text class="body-en" x="75" y="2194" >alternative model architectures,</text>
<text class="body-en" x="75" y="2217" >exploring TabPFN, gradient-boosted</text>
<text class="body-en" x="75" y="2240" >trees, and FT-Transformer, while</text>
<text class="body-en" x="75" y="2263" >investigating the mechanisms and</text>
<text class="body-en" x="75" y="2286" >potential applications of emerging</text>
<text class="body-en" x="75" y="2309" >approaches such as JEV. Continuing</text>
<text class="body-en" x="75" y="2332" >to identify promising research</text>
<text class="body-en" x="75" y="2355" >questions and technical</text>
<text class="body-en" x="75" y="2378" >opportunities.</text>
<path class="hairline" d="M75 2401H315"/>
<text class="body-zh" x="75" y="2428" >将探索范围延伸至表格学习与新型模</text>
<text class="body-zh" x="75" y="2453" >型架构，研究 TabPFN、梯度提升树</text>
<text class="body-zh" x="75" y="2478" >和 FT-Transformer 等方法，并关</text>
<text class="body-zh" x="75" y="2503" >注 JEV 等新兴方向的机制与应用潜</text>
<text class="body-zh" x="75" y="2528" >力。持续拓展技术视野，寻找具有研</text>
<text class="body-zh" x="75" y="2553" >究价值的问题与切入点。</text>
