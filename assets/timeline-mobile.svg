<text class="date" x="89" y="1322" >SUMMER 2026</text>
<path class="hairline" d="M75 1334H315"/>
<text class="title-en" x="75" y="1361" >Multimodal Intelligence &amp; Policy</text>
<text class="title-en" x="75" y="1383" >Distillation</text>
<text class="title-zh" x="75" y="1409" >多模态智能与策略蒸馏</text>
<text class="body-en" x="75" y="1454" >Extended my research focus to</text>
<text class="body-en" x="75" y="1477" >multimodal large language models and</text>
<text class="body-en" x="75" y="1500" >Online Policy Distillation (OPD).</text>
<text class="body-en" x="75" y="1523" >With access to advanced computing</text>
<text class="body-en" x="75" y="1546" >resources, I independently pursued</text>
<text class="body-en" x="75" y="1569" >Vision-OPD reproduction and</text>
<text class="body-en" x="75" y="1592" >follow-up experiments, testing</text>
<text class="body-en" x="75" y="1615" >methodological hypotheses, analyzing</text>
<text class="body-en" x="75" y="1638" >performance gaps, and investigating</text>
<text class="body-en" x="75" y="1661" >the possibilities and limitations of</text>
<text class="body-en" x="75" y="1684" >model capability transfer.</text>
<path class="hairline" d="M75 1707H315"/>
<text class="body-zh" x="75" y="1734" >将研究重心拓展至多模态大语言模型</text>
<text class="body-zh" x="75" y="1759" >与在线策略蒸馏（Online Policy</text>
<text class="body-zh" x="75" y="1784" >Distillation, OPD）。借助高水平计</text>
<text class="body-zh" x="75" y="1809" >算资源，独立开展 Vision-OPD 复现</text>
<text class="body-zh" x="75" y="1834" >与后续方案探索，通过实验检验方法</text>
<text class="body-zh" x="75" y="1859" >假设、分析性能差距，并进一步理解</text>
<text class="body-zh" x="75" y="1884" >模型能力迁移的技术路径与局限。</text>
