<text class="title-en" x="75" y="2039" >Directions</text>
<text class="title-zh" x="75" y="2065" >模型架构与前沿探索</text>
<text class="body-en" x="75" y="2110" >Expanded into tabular learning and</text>
<text class="body-en" x="75" y="2133" >alternative model architectures,</text>
<text class="body-en" x="75" y="2156" >exploring TabPFN, gradient-boosted</text>
<text class="body-en" x="75" y="2179" >trees, and FT-Transformer, while</text>
<text class="body-en" x="75" y="2202" >investigating the mechanisms and</text>
<text class="body-en" x="75" y="2225" >potential applications of emerging</text>
<text class="body-en" x="75" y="2248" >approaches such as JEV. Continuing</text>
<text class="body-en" x="75" y="2271" >to identify promising research</text>
<text class="body-en" x="75" y="2294" >questions and technical</text>
<text class="body-en" x="75" y="2317" >opportunities.</text>
<path class="hairline" d="M75 2340H315"/>
<text class="body-zh" x="75" y="2367" >将探索范围延伸至表格学习与新型模</text>
<text class="body-zh" x="75" y="2392" >型架构，研究 TabPFN、梯度提升树</text>
<text class="body-zh" x="75" y="2417" >和 FT-Transformer 等方法，并关</text>
<text class="body-zh" x="75" y="2442" >注 JEV 等新兴方向的机制与应用潜</text>
<text class="body-zh" x="75" y="2467" >力。持续拓展技术视野，寻找具有研</text>
<text class="body-zh" x="75" y="2492" >究价值的问题与切入点。</text>
