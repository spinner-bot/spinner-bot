<text class="date" x="89" y="714" >SPRING 2026</text>
<path class="hairline" d="M75 726H315"/>
<text class="title-en" x="75" y="753" >Machine Learning &amp; Research</text>
<text class="title-en" x="75" y="775" >Practice</text>
<text class="title-zh" x="75" y="801" >机器学习与研究实践</text>
<text class="body-en" x="75" y="846" >Developed a broad foundation in</text>
<text class="body-en" x="75" y="869" >machine learning and deep learning</text>
<text class="body-en" x="75" y="892" >through model implementation and</text>
<text class="body-en" x="75" y="915" >experimentation. Joined a research</text>
<text class="body-en" x="75" y="938" >team to investigate specific machine</text>
<text class="body-en" x="75" y="961" >learning algorithm optimization</text>
<text class="body-en" x="75" y="984" >problems, extending my focus from</text>
<text class="body-en" x="75" y="1007" >learning algorithms to research</text>
<text class="body-en" x="75" y="1030" >questions, methodological design, and</text>
<text class="body-en" x="75" y="1053" >empirical analysis.</text>
<path class="hairline" d="M75 1076H315"/>
<text class="body-zh" x="75" y="1103" >系统拓展机器学习与深度学习知识，</text>
<text class="body-zh" x="75" y="1128" >通过模型实现和实验建立对核心方法</text>
<text class="body-zh" x="75" y="1153" >的理解。进入研究团队，开始探索具</text>
<text class="body-zh" x="75" y="1178" >体的机器学习算法优化问题，将关注</text>
<text class="body-zh" x="75" y="1203" >点从算法学习推进到研究问题、方法</text>
<text class="body-zh" x="75" y="1228" >设计与实证分析。</text>
