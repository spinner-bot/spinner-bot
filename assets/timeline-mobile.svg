<text class="date" x="89" y="81" >AUTUMN 2025</text>
<path class="hairline" d="M75 93H315"/>
<text class="title-en" x="75" y="120" >Programming Foundations &amp; First</text>
<text class="title-en" x="75" y="142" >Builds</text>
<text class="title-zh" x="75" y="168" >编程基础与工程起步</text>
<text class="body-en" x="75" y="213" >Began undergraduate study at Hohai</text>
<text class="body-en" x="75" y="236" >University, establishing a</text>
<text class="body-en" x="75" y="259" >foundation in computing and</text>
<text class="body-en" x="75" y="282" >intelligent technologies. C/C++</text>
<text class="body-en" x="75" y="305" >programming and team software</text>
<text class="body-en" x="75" y="328" >projects developed my ability to</text>
<text class="body-en" x="75" y="351" >translate problems into working</text>
<text class="body-en" x="75" y="374" >implementations.</text>
<path class="hairline" d="M75 397H315"/>
<text class="body-zh" x="75" y="424" >进入河海大学，开启计算机与智能技</text>
<text class="body-zh" x="75" y="449" >术领域的系统学习。通过 C/C++ 编</text>
<text class="body-zh" x="75" y="474" >程和团队软件项目建立实现基础，逐</text>
<text class="body-zh" x="75" y="499" >步形成从问题分析到代码落地的工程</text>
<text class="body-zh" x="75" y="524" >思维。</text>
