<text class="date" x="89" y="775" >SPRING 2026</text>
<path class="hairline" d="M75 787H315"/>
<text class="title-en" x="75" y="814" >Machine Learning &amp; Research</text>
<text class="title-en" x="75" y="836" >Practice</text>
<text class="title-zh" x="75" y="862" >机器学习与研究实践</text>
<text class="body-en" x="75" y="907" >Developed a broad foundation in</text>
<text class="body-en" x="75" y="930" >machine learning and deep learning</text>
<text class="body-en" x="75" y="953" >through model implementation and</text>
<text class="body-en" x="75" y="976" >experimentation. Joined a research</text>
<text class="body-en" x="75" y="999" >team to investigate specific machine</text>
<text class="body-en" x="75" y="1022" >learning algorithm optimization</text>
<text class="body-en" x="75" y="1045" >problems, extending my focus from</text>
<text class="body-en" x="75" y="1068" >learning algorithms to research</text>
<text class="body-en" x="75" y="1091" >questions, methodological design, and</text>
<text class="body-en" x="75" y="1114" >empirical analysis.</text>
<path class="hairline" d="M75 1137H315"/>
<text class="body-zh" x="75" y="1164" >系统拓展机器学习与深度学习知识，</text>
<text class="body-zh" x="75" y="1189" >通过模型实现和实验建立对核心方法</text>
<text class="body-zh" x="75" y="1214" >的理解。进入研究团队，开始探索具</text>
<text class="body-zh" x="75" y="1239" >体的机器学习算法优化问题，将关注</text>
<text class="body-zh" x="75" y="1264" >点从算法学习推进到研究问题、方法</text>
<text class="body-zh" x="75" y="1289" >设计与实证分析。</text>
