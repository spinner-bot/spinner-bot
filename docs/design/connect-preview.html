<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's connect！ preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #f6f8fa; }
    picture { display: block; max-width: 1200px; margin: 0 auto; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 640px) { body { padding: 0; } }
  </style>
</head>
<body>
  <picture>
    <source media="(max-width: 640px) and (prefers-reduced-motion: reduce)" srcset="../../assets/connect-mobile-still.svg">

    <source media="(max-width: 640px)" srcset="../../assets/connect-mobile.svg">
    <img src="../../assets/connect.svg" alt="Let's connect invitation">
  </picture>
</body>
</html>
