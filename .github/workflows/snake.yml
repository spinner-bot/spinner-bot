name: Generate Snake Animation

on:
  schedule:
    # 每小时第 17 分钟运行（UTC 时间；北京时间同样为每小时 :17）
    # GitHub 高峰期可能延迟数分钟~数十分钟，属正常现象
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# 关键：授予写入权限
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        env:
          # 用本人 PAT（read:user）查询，可纳入私有仓库贡献；
          # 未配置该 secret 时为空字符串，snk 自动回退为匿名（仅公开贡献）
          GITHUB_TOKEN: ${{ secrets.SNK_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add a dark canvas to the dark-mode SVG
        run: |
          python - <<'PY'
          from pathlib import Path

          svg_path = Path("dist/github-contribution-grid-snake-dark.svg")
          svg = svg_path.read_text(encoding="utf-8")
          root_end = svg.find(">")
          if not svg.lstrip().startswith("<svg") or root_end < 0:
              raise SystemExit("Generated snake asset is not a valid SVG document")
          background = '<rect width="100%" height="100%" rx="16" fill="#061117"/>'
          svg_path.write_text(svg[:root_end + 1] + background + svg[root_end + 1:], encoding="utf-8")
          PY

      - name: Push SVGs to output branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan output 2>/dev/null || git checkout output
          git rm -rf . 2>/dev/null || true
          cp dist/*.svg .
          git add *.svg
          git commit -m "Update snake animation [skip ci]" || true
          git push origin output --force
