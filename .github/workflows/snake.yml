name: Generate Snake Animation

on:
  schedule:
    # 每小时第 17 分钟运行（UTC 时间；北京时间同样为每小时 :17）
    # GitHub 高峰期可能延迟数分钟~数十分钟，属正常现象
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# 关键：授予写入权限
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # if: 条件里不能直接引用 secrets，所以先提到 job 级环境变量再判断
    env:
      SNK_TOKEN: ${{ secrets.SNK_TOKEN }}

    steps:
      # ① 配了 PAT 就优先用它：能统计到私有仓库的贡献
      - name: Generate snake SVGs (with private contributions)
        id: snake-private
        if: env.SNK_TOKEN != ''
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        env:
          # snk 内部是 process.env.GITHUB_TOKEN ?? getInput("github_token")，
          # 空字符串不会触发 ?? 回退，所以这里绝不能塞空值进来。
          GITHUB_TOKEN: ${{ secrets.SNK_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ② PAT 没配 / 过期 / 权限不足时，自动退回只统计公开贡献
      - name: Generate snake SVGs (public contributions only)
        if: steps.snake-private.outcome != 'success'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
