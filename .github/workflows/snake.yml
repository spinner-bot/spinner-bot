name: Generate Snake Animation

on:
  schedule:
    # 每小时第 17 分钟运行（UTC 时间；北京时间同样为每小时 :17）
    # GitHub 高峰期可能延迟数分钟~数十分钟，属正常现象
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# 关键：授予写入权限
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        env:
          # ⚠️ 必须做兜底。snk 内部写的是：
          #   process.env.GITHUB_TOKEN ?? getInput("github_token")
          # 若 SNK_TOKEN 不存在或已过期，表达式会解析成空字符串 ""，
          # 而空字符串不会触发 ?? 回退 —— 动作会用空 token 请求 API，1 秒内失败。
          # （2026-10-11 ~ 2026-11-19 的停更正是这个原因，详见
          #   docs/ops/snake-contribution-graph.md）
          # 有 PAT 时用它（可纳入私有仓库贡献），没有时退回内置 token。
          GITHUB_TOKEN: ${{ secrets.SNK_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
